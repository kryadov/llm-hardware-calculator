name: Deploy to GitHub Pages

# A release is always cut from a commit that is already on `main`, so the `push`
# trigger has deployed it seconds earlier. Triggering on `release` as well raced
# two runs for the same commit against a single Pages deployment slot.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# `cancel-in-progress: false` is deliberate and is what GitHub's own Pages
# template specifies: queue newer runs, but never cancel a deployment already in
# flight. With `true`, a second run would cancel the first *mid-deployment*,
# leaving the Pages API with a half-finished deployment — which showed up as
# "Deployment cancelled" failures and, once, a deploy step that hung until its
# ten-minute timeout while the site kept serving the previous build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
